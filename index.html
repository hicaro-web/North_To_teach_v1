<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>NORTH | مكتبة التعليم</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--line:#292d39;--text:#f1f2f6;--muted:#a2a7b5;--gold:#d8bd78}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#171b27,#08090d 58%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.muted{color:var(--muted);font-size:12px;line-height:1.8}main{max-width:1050px;margin:auto;padding:28px 18px 55px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:800}.hero{padding:25px 0}.hero h1{font-size:clamp(28px,5vw,44px);margin:10px 0}.hero p{max-width:650px;line-height:1.9;color:var(--muted)}.search{width:100%;font:inherit;background:#0c0e14;color:var(--text);border:1px solid var(--line);padding:13px;border-radius:12px;margin:10px 0 20px;outline:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip,button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#171a23;color:var(--text);padding:10px 14px}.chip.active{border-color:var(--gold);color:var(--gold);background:#292417}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(145deg,#151821,#0f1117);border:1px solid var(--line);border-radius:17px;padding:18px;cursor:pointer;min-height:150px}.card:hover{border-color:#746747;transform:translateY(-2px)}.tag{font-size:11px;color:var(--gold);border:1px solid #51462d;border-radius:30px;padding:5px 9px;display:inline-block}.card h3{margin:14px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.8;margin:0}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}#reader{display:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);margin-top:20px}#readBody{white-space:pre-wrap;line-height:2;overflow-wrap:anywhere;margin-top:20px}.back{margin-bottom:15px;color:var(--gold);background:transparent}.status{margin:16px 0;color:var(--muted);font-size:12px}footer{text-align:center;border-top:1px solid var(--line);padding:22px;color:#686e7d;font-size:12px}
</style></head><body><header><div><div class="brand">NORTH <span>/ KNOWLEDGE</span></div><div class="muted">مكتبة التعليمات والمعرفة</div></div><div class="muted">مرجع الجمهور</div></header><main><section class="hero"><div class="eyebrow">KNOWLEDGE ARCHIVE</div><h1>مكتبة التعليم</h1><p>ابحث عن التعليم الذي تحتاجه وافتحه لقراءة الشرح كاملًا. المحتوى المنشور فقط يظهر هنا.</p></section><input class="search" id="search" placeholder="ابحث عن تعليم..." aria-label="بحث"><div class="chips" id="categories"></div><div id="status" class="status">جاري تحميل التعليمات...</div><div id="cards" class="grid"></div><section id="reader"><button class="back" id="back">← العودة للتعليمات</button><div id="readTag" class="tag"></div><h2 id="readTitle"></h2><p id="readDesc" class="muted"></p><div id="readBody"></div></section></main><footer>NORTH KNOWLEDGE ARCHIVE</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://ohoniavbvwgaajxydwpo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QAabnby8UScC8UnKwVeL3Q_zoTvDo3C";
const READY=https://ohoniavbvwgaajxydwpo.supabase.co.startsWith("https://")&&!SUPABASE_ANON_KEY.includes("PASTE_");
const $=id=>document.getElementById(id);let sb=null,articles=[],selected="الكل";
const cats=["الكل","النشر","الاستقبال","الإدارة","القوانين","أخرى"];
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function chips(){$("categories").innerHTML=cats.map(c=>`<button class="chip ${selected===c?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{selected=b.dataset.cat;chips();render()})}
function render(){let q=$("search").value.trim().toLowerCase();let list=articles.filter(a=>(selected==="الكل"||a.category===selected)&&`${a.title} ${a.description} ${a.category}`.toLowerCase().includes(q));$("cards").innerHTML=list.length?list.map(a=>`<article class="card" data-id="${esc(a.id)}"><span class="tag">${esc(a.category)}</span><h3>${esc(a.title)}</h3><p>${esc(a.description)}</p></article>`).join(""):'<div class="empty">لا توجد تعليمات منشورة تطابق بحثك.</div>';document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>open(el.dataset.id))}
function open(id){const a=articles.find(x=>x.id===id);if(!a)return;$("reader").style.display="block";$("cards").style.display="none";$("categories").style.display="none";$("search").style.display="none";$("status").style.display="none";$("readTag").textContent=a.category;$("readTitle").textContent=a.title;$("readDesc").textContent=a.description;$("readBody").textContent=a.body;scrollTo({top:0,behavior:"smooth"})}
$("back").onclick=()=>{$("reader").style.display="none";$("cards").style.display="grid";$("categories").style.display="flex";$("search").style.display="block";$("status").style.display="block"};
$("search").oninput=render;
async function start(){chips();if(!READY){$("status").textContent="الموقع جاهز شكليًا، لكنه يحتاج رابط Supabase ومفتاح anon العام للاتصال بقاعدة البيانات.";articles=[];render();return}sb=window.supabase.createClient(https://ohoniavbvwgaajxydwpo.supabase.co,SUPABASE_ANON_KEY);const {data,error}=await sb.from("knowledge_articles").select("id,title,category,description,body,published").eq("published",true).order("created_at",{ascending:false});if(error){$("status").textContent="تعذر تحميل المحتوى. راجع إعدادات Supabase وسياسات القراءة.";console.error(error);return}articles=data||[];$("status").textContent=articles.length?"تم تحميل "+articles.length+" مادة منشورة.":"لا توجد مواد منشورة حتى الآن.";render()}
start();
</script></body></html>
